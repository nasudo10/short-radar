<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar de Shorts Virais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1720;
    --panel: #16212C;
    --panel-hover: #1C2B38;
    --border: #253645;
    --amber: #FF8A3D;
    --amber-dim: #7A4526;
    --text: #E8EDF2;
    --text-dim: #7C8A99;
    --green: #4ADE80;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  /* ---------- HEADER / SIGNATURE ---------- */
  header{
    position: relative;
    padding: 40px 32px 28px;
    border-bottom: 1px solid var(--border);
    overflow: hidden;
    background: linear-gradient(180deg, #121D27 0%, #0F1720 100%);
  }
  .scan-line{
    position: absolute;
    top: 0; left: -30%;
    width: 30%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,138,61,0.08), transparent);
    animation: sweep 4.5s linear infinite;
  }
  @keyframes sweep{
    0%{ left: -30%; }
    100%{ left: 130%; }
  }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--amber);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 0 0 rgba(255,138,61,0.6);
    animation: ping 1.6s infinite;
  }
  @keyframes ping{
    0%{ box-shadow: 0 0 0 0 rgba(255,138,61,0.55); }
    70%{ box-shadow: 0 0 0 9px rgba(255,138,61,0); }
    100%{ box-shadow: 0 0 0 0 rgba(255,138,61,0); }
  }
  h1{
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: clamp(34px, 5vw, 52px);
    letter-spacing: 0.5px;
    line-height: 1;
  }
  .subtitle{
    color: var(--text-dim);
    font-size: 15px;
    margin-top: 10px;
    max-width: 560px;
  }
  .meta-row{
    display: flex;
    gap: 28px;
    margin-top: 24px;
    flex-wrap: wrap;
  }
  .meta-item{
    font-family: 'IBM Plex Mono', monospace;
  }
  .meta-item .label{
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .meta-item .value{
    font-size: 20px;
    color: var(--text);
    font-weight: 600;
  }

  /* ---------- GRID ---------- */
  main{ padding: 32px; }
  .status{
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-dim);
    font-size: 13px;
    padding: 40px 0;
    text-align: center;
  }
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }
  .card{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .card:hover{
    transform: translateY(-3px);
    border-color: var(--amber-dim);
    background: var(--panel-hover);
  }
  .thumb-wrap{
    position: relative;
    aspect-ratio: 9 / 16;
    background: #0A1116;
    overflow: hidden;
  }
  .thumb-wrap img{
    width: 100%; height: 100%; object-fit: cover;
    display:block;
  }
  .rank{
    position: absolute;
    top: 10px; left: 10px;
    background: rgba(15,23,32,0.85);
    border: 1px solid var(--amber-dim);
    color: var(--amber);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 5px;
  }
  .lang-badge{
    position: absolute;
    top: 10px; right: 10px;
    background: rgba(15,23,32,0.85);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 3px 7px;
    border-radius: 5px;
    text-transform: uppercase;
    border: 1px solid var(--border);
  }
  .card-body{
    padding: 14px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }
  .title{
    font-size: 14px;
    font-weight: 500;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .channel{
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .stats-row{
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
  }
  .velocity{
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .velocity .num{
    color: var(--green);
    font-size: 16px;
    font-weight: 600;
  }
  .velocity .lbl{
    color: var(--text-dim);
    font-size: 10px;
    letter-spacing: 1px;
  }
  .views{
    text-align: right;
  }
  .views .num{
    font-size: 14px;
    font-weight: 500;
  }
  .views .lbl{
    color: var(--text-dim);
    font-size: 10px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<header>
  <div class="scan-line"></div>
  <div class="eyebrow"><span class="dot"></span> CAPTANDO SINAL — SHORTS EM ALTA</div>
  <h1>Radar de Shorts Virais</h1>
  <p class="subtitle">Shorts em inglês e espanhol publicados nas últimas 48h, ranqueados por velocidade de visualizações — o que está bombando agora, não o que já é grande.</p>
  <div class="meta-row">
    <div class="meta-item">
      <div class="label">Última atualização</div>
      <div class="value" id="updated-at">—</div>
    </div>
    <div class="meta-item">
      <div class="label">Vídeos captados</div>
      <div class="value" id="video-count">—</div>
    </div>
    <div class="meta-item">
      <div class="label">Janela</div>
      <div class="value">48h</div>
    </div>
  </div>
</header>

<main>
  <div id="status" class="status">Carregando dados...</div>
  <div id="grid" class="grid"></div>
</main>

<script>
  // Ajuste este caminho para a URL "raw" do seu data.json no GitHub, por exemplo:
  // https://raw.githubusercontent.com/SEU-USUARIO/youtube-shorts-radar/main/data/data.json
  const DATA_URL = "./data/data.json";

  function formatNumber(n){
    if(n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'') + 'M';
    if(n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'K';
    return String(n);
  }

  function detectLang(title){
    // heurística simples só para exibição do badge
    return '';
  }

  function render(data){
    const grid = document.getElementById('grid');
    const status = document.getElementById('status');
    document.getElementById('video-count').textContent = data.videos.length;
    document.getElementById('updated-at').textContent = new Date(data.generatedAt).toLocaleString('pt-BR', {
      day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
    });

    if(!data.videos.length){
      status.textContent = 'Nenhum vídeo encontrado na última janela.';
      return;
    }
    status.style.display = 'none';

    grid.innerHTML = data.videos.map((v, i) => `
      <a class="card" href="${v.url}" target="_blank" rel="noopener">
        <div class="thumb-wrap">
          <img src="${v.thumbnail}" alt="${v.title.replace(/"/g,'&quot;')}" loading="lazy">
          <div class="rank">#${i + 1}</div>
        </div>
        <div class="card-body">
          <div class="title">${v.title}</div>
          <div class="channel">${v.channel}</div>
          <div class="stats-row">
            <div class="velocity">
              <span class="num">${formatNumber(v.velocity)}/h</span>
              <span class="lbl">VELOCIDADE</span>
            </div>
            <div class="views">
              <span class="num">${formatNumber(v.views)}</span>
              <span class="lbl">VISUALIZAÇÕES</span>
            </div>
          </div>
        </div>
      </a>
    `).join('');
  }

  const DEMO_DATA = {
    generatedAt: new Date().toISOString(),
    videos: [
      { title: "This kitchen hack changed EVERYTHING", channel: "@cookwithmax", views: 4200000, velocity: 195000, thumbnail: "https://placehold.co/405x720/16212C/7C8A99?text=EN", url: "#" },
      { title: "No puedo creer que esto sea real...", channel: "@vidaentreamigos", views: 2100000, velocity: 141000, thumbnail: "https://placehold.co/405x720/16212C/7C8A99?text=ES", url: "#" },
      { title: "POV: your dog understands sarcasm", channel: "@petclips", views: 3800000, velocity: 128000, thumbnail: "https://placehold.co/405x720/16212C/7C8A99?text=EN", url: "#" },
      { title: "El truco de organización que todos necesitan", channel: "@ordenaconana", views: 1500000, velocity: 98000, thumbnail: "https://placehold.co/405x720/16212C/7C8A99?text=ES", url: "#" },
      { title: "I tried the viral 5-minute workout", channel: "@fitwithjules", views: 2600000, velocity: 87000, thumbnail: "https://placehold.co/405x720/16212C/7C8A99?text=EN", url: "#" },
      { title: "3 frases que cambiarán tu forma de vender", channel: "@negociosconlu", views: 980000, velocity: 65000, thumbnail: "https://placehold.co/405x720/16212C/7C8A99?text=ES", url: "#" },
    ]
  };

  fetch(DATA_URL)
    .then(r => {
      if(!r.ok) throw new Error('data.json não encontrado ainda');
      return r.json();
    })
    .then(render)
    .catch(err => {
      document.getElementById('status').innerHTML =
        '⚠️ Exibindo dados de <strong>demonstração</strong> — configure a API e o GitHub Actions para ver os vídeos reais.';
      render(DEMO_DATA);
      document.getElementById('status').style.display = 'block';
      document.getElementById('status').style.padding = '0 0 20px';
      document.getElementById('status').style.color = 'var(--amber)';
    });
</script>

</body>
</html>
